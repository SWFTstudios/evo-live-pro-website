<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Evo Live Pro Photos · Preview</title>
<link rel="icon" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0B}
a{color:#F4F4F0}a:hover{color:#B8FF3C}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div style="background: #0A0A0B; color: #F4F4F0; font-family: Inter, system-ui, sans-serif; min-height: 100vh">

  <header style="position: sticky; top: 0; z-index: 5; background: rgba(10,10,11,0.94); border-bottom: 1px solid #2A2A2E">
    <nav aria-label="Main" style="max-width: 1320px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
      <a href="home.html" style="display: block"><img src="assets/logo-wordmark.png" alt="Evo Live Pro home" style="width: 168px; height: auto; display: block"></a>
      <div style="display: flex; gap: 22px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; flex: 1 1 auto; justify-content: center">
        <a href="home.html" style="text-decoration: none; color: #A1A1A6">HOME</a>
        <a href="about.html" style="text-decoration: none; color: #A1A1A6">ABOUT US</a>
        <a href="rentals.html" style="text-decoration: none; color: #A1A1A6">RENTALS</a>
        <a href="events.html" style="text-decoration: none; color: #A1A1A6">EVENTS</a>
        <a href="home.html#partners" style="text-decoration: none; color: #A1A1A6">PARTNERS</a>
        <a href="photos.html" style="text-decoration: none; color: #F4F4F0">PHOTOS</a>
        <a href="contact.html" style="text-decoration: none; color: #A1A1A6">CONTACT US</a>
      </div>
      <div style="display: flex; gap: 8px">
        <a href="contact.html" style="background: #B8FF3C; color: #0A0A0B; text-decoration: none; height: 44px; padding: 0 18px; display: inline-flex; align-items: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 13px; letter-spacing: 0.04em">BOOK EVO</a>
        <a href="rentals.html" style="background: #FF6A1F; color: #0A0A0B; text-decoration: none; height: 44px; padding: 0 18px; display: inline-flex; align-items: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 13px; letter-spacing: 0.04em">RENT GEAR</a>
      </div>
    </nav>
  </header>

  <section style="max-width: 1320px; margin: 0 auto; padding: 72px 24px 32px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">PHOTOS &amp; VIDEO</span>
      <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 125%; font-weight: 800; font-size: clamp(40px, 6vw, 80px); line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase">See the work</h1>
    </div>
    <a href="https://instagram.com/evolivepro" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-underline-offset: 6px">MORE ON INSTAGRAM @EVOLIVEPRO →</a>
  </section>

  <section style="max-width: 1320px; margin: 0 auto; padding: 0 24px 96px; display: flex; flex-direction: column; gap: 24px">
    <div role="group" aria-label="Filter photos" style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="7">
        <button type="button" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); grid-auto-rows: 240px; gap: 12px">
      <sc-for list="{{shots}}" as="s" hint-placeholder-count="9">
        <div style="{{s.box}}">
          <sc-if value="{{s.video}}" hint-placeholder-val="{{ false }}">
            <span style="align-self: flex-start; background: #F4F4F0; color: #0A0A0B; padding: 6px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em">▶ VIDEO</span>
          </sc-if>
          <span style="margin-top: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #B8FF3C">{{s.tag}}</span>
          <span style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 18px">{{s.title}}</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A1A1A6">{{s.src}}</span>
        </div>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 14px; color: #A1A1A6; line-height: 1.55">Click any tile to open full screen with swipe. Only clean, well-lit shots make the cut, per Tim's notes.</p>
  </section>

  <section style="background: #141416; border-top: 1px solid #2A2A2E">
    <div style="max-width: 1320px; margin: 0 auto; padding: 64px 24px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: center">
      <h2 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase">Want this at your event?</h2>
      <div style="display: flex; gap: 12px; flex-wrap: wrap">
        <a href="contact.html" style="background: #B8FF3C; color: #0A0A0B; text-decoration: none; height: 52px; padding: 0 24px; display: inline-flex; align-items: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 14px; letter-spacing: 0.04em">BOOK EVO</a>
        <a href="rentals.html" style="background: #FF6A1F; color: #0A0A0B; text-decoration: none; height: 52px; padding: 0 24px; display: inline-flex; align-items: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 14px; letter-spacing: 0.04em">RENT THE GEAR</a>
      </div>
    </div>
  </section>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":1440,"height":2200}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'All' }; }
  renderVals() {
    const all = [
      { cat: 'Weddings', title: 'The Graziano Wedding', src: 'DRIVE · GRAZIANO CLIPS', video: true, big: true },
      { cat: 'Corporate', title: '[Brand event]', src: 'DRIVE · GENERAL PHOTOS', video: false },
      { cat: 'Concerts', title: '[Show · venue]', src: 'INSTAGRAM @EVOLIVEPRO', video: true },
      { cat: 'Weddings', title: 'The Lam Wedding', src: 'DRIVE · LAM WEDDING', video: false },
      { cat: 'Behind the Scenes', title: 'Tim &amp; Dom', src: 'PATRISSO PHOTOSHOOT', video: false, big: true },
      { cat: 'Weddings', title: 'The Sullivan Wedding', src: 'DRIVE · SULLIVAN FOLDER', video: false },
      { cat: 'Private Parties', title: '[Private event]', src: 'DRIVE · GENERAL PHOTOS', video: false },
      { cat: 'Corporate', title: '[LED wall setup]', src: 'DRIVE · GENERAL PHOTOS', video: false },
      { cat: 'Concerts', title: '[Lasers + crowd]', src: 'INSTAGRAM @EVOLIVEPRO', video: false },
      { cat: 'Behind the Scenes', title: '[Load-in / rigging]', src: 'DRIVE · GENERAL PHOTOS', video: false }
    ].map((s) => ({ ...s, title: s.title.replace('&amp;', '&') }));
    const labels = ['All', 'Weddings', 'Corporate', 'Concerts', 'Private Parties', 'Behind the Scenes', 'Video'];
    const tab = this.state.tab;
    const tabs = labels.map((l) => ({
      label: l.toUpperCase(),
      pick: () => this.setState({ tab: l }),
      style: 'height: 44px; padding: 0 14px; cursor: pointer; font-family: \'JetBrains Mono\', monospace; font-size: 12px; letter-spacing: 0.08em; ' + (l === tab ? 'background: #F4F4F0; color: #0A0A0B; border: 0' : 'background: transparent; color: #A1A1A6; border: 1px solid #2A2A2E')
    }));
    const shots = all
      .filter((s) => tab === 'All' || (tab === 'Video' ? s.video : s.cat === tab))
      .map((s) => ({
        ...s,
        tag: s.cat.toUpperCase(),
        box: 'background: #1E1E22; padding: 18px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box' + (s.big && tab === 'All' ? '; grid-row: span 2' : '')
      }));
    return { tabs, shots };
  }
}
</script>
<script src="dc-runtime.js"></script>
<a class="pv-back" href="./">&larr; All pages</a>
<style>
.pv-back{position:fixed;left:16px;bottom:16px;z-index:50;background:#F4F4F0;color:#0A0A0B;
font:500 12px/1 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;
padding:12px 14px;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.pv-back:hover{background:#B8FF3C;color:#0A0A0B}
</style>
</body>
</html>

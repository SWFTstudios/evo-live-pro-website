<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Evo Live Pro Style Guide · Preview</title>
<link rel="icon" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0B}
a{color:#F4F4F0}a:hover{color:#E6307F}
</style>

</head>
<body>
<div id="dc-root" style="overflow-x:auto;display:flex;justify-content:center;background:#000"></div>
<template id="dc-template">

<div style="width: 1440px; min-height: 3000px; box-sizing: border-box; background: #0A0A0B; color: #F4F4F0; font-family: Inter, system-ui, sans-serif; padding: 72px 96px 96px; display: flex; flex-direction: column; gap: 88px">

  <header style="display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #2A2A2E; padding-bottom: 40px">
    <div style="display: flex; flex-direction: column; gap: 20px">
      <img src="assets/logo-wordmark.png" alt="Evo Live Pro" style="width: 360px; height: auto; display: block">
      <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 72px; line-height: 1; letter-spacing: -0.02em; text-transform: uppercase">Style Guide</h1>
    </div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #A1A1A6; text-align: right; line-height: 1.7">V0.1 · DRAFT FOR TIM &amp; DOM<br>PREPARED BY SWFT STUDIOS<br>NOV 2026</div>
  </header>

  <section style="display: grid; grid-template-columns: 280px 1fr; gap: 48px">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #A1A1A6; letter-spacing: 0.08em">01 / LOGO</div>
    <div style="display: flex; flex-direction: column; gap: 24px">
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 16px">
        <div style="background: #141416; border: 1px solid #2A2A2E; height: 240px; display: flex; align-items: center; justify-content: center"><img src="assets/logo-wordmark.png" alt="Evo Live Pro wordmark" style="width: 420px; height: auto"></div>
        <div style="background: #141416; border: 1px solid #2A2A2E; height: 240px; display: flex; align-items: center; justify-content: center"><img src="assets/logo-mark.png" alt="Evo Live Pro mark" style="width: 104px; height: auto"></div>
        <div style="background: {{book}}; height: 240px; display: flex; align-items: center; justify-content: center"><img src="assets/logo-mark.png" alt="Evo Live Pro mark on accent" style="width: 104px; height: auto; filter: invert(1)"></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; font-size: 15px; line-height: 1.55; color: #C9C9CC">
        <p style="margin: 0"><strong style="color: #F4F4F0">Horizontal lockup</strong> is the default in the site header and footer. Minimum width 140px on desktop, 120px on phones.</p>
        <p style="margin: 0"><strong style="color: #F4F4F0">Hex mark alone</strong> for favicon, social avatars, watermarks on photos and the loading state.</p>
        <p style="margin: 0"><strong style="color: #F4F4F0">Keep it white or black.</strong> Never recolor the logo, add glows, gradients or bevels. Clear space equals the height of the "E".</p>
      </div>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: 280px 1fr; gap: 48px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #A1A1A6; letter-spacing: 0.08em">02 / COLOR</div>
      <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #A1A1A6">The brand stays black and white. Two signal colors do the wayfinding, one per audience, so a visitor always knows which path they are on.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 32px">
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; background: #0A0A0B; border: 1px solid #2A2A2E"></div><div style="font-size: 14px; font-weight: 600">Blackout</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6">#0A0A0B · page</div></div>
        <div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; background: #141416; border: 1px solid #2A2A2E"></div><div style="font-size: 14px; font-weight: 600">Stage</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6">#141416 · cards</div></div>
        <div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; background: #1E1E22"></div><div style="font-size: 14px; font-weight: 600">Rig</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6">#1E1E22 · inputs</div></div>
        <div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; background: #2A2A2E"></div><div style="font-size: 14px; font-weight: 600">Cable</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6">#2A2A2E · lines</div></div>
        <div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; background: #A1A1A6"></div><div style="font-size: 14px; font-weight: 600">Haze</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6">#A1A1A6 · secondary text</div></div>
        <div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; background: #F4F4F0"></div><div style="font-size: 14px; font-weight: 600">House Light</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6">#F4F4F0 · text</div></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <div style="background: {{book}}; color: #0A0A0B; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; box-sizing: border-box">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">SIGNAL A · LASER</div>
          <div style="font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 40px; text-transform: uppercase; line-height: 1">Book the show</div>
          <div style="font-size: 15px; line-height: 1.5; max-width: 420px">For anyone hiring Evo to perform or produce: DJ, production, weddings, corporate, concerts. Used on "Book Evo" buttons, event pages and the booking form.</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-top: auto">{{bookHex}} · black text only</div>
        </div>
        <div style="background: {{rent}}; color: #0A0A0B; padding: 28px; display: flex; flex-direction: column; gap: 10px; min-height: 200px; box-sizing: border-box">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">SIGNAL B · CUE</div>
          <div style="font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 40px; text-transform: uppercase; line-height: 1">Rent the gear</div>
          <div style="font-size: 15px; line-height: 1.5; max-width: 420px">For planners, venues, DJs and production teams who need equipment. Used on "Add to quote", the rentals catalog and the quote cart.</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; margin-top: auto">{{rentHex}} · black text only</div>
        </div>
      </div>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: 280px 1fr; gap: 48px">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #A1A1A6; letter-spacing: 0.08em">03 / TYPE</div>
    <div style="display: flex; flex-direction: column; gap: 0">
      <div style="display: grid; grid-template-columns: 220px 1fr; gap: 32px; padding: 28px 0; border-top: 1px solid #2A2A2E; align-items: baseline">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6; line-height: 1.7">DISPLAY<br>Archivo Expanded 800<br>Uppercase · 64–96px</div>
        <div style="font-family: Archivo, sans-serif; font-stretch: 125%; font-weight: 800; font-size: 88px; line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase">Bring out<br>the lasers</div>
      </div>
      <div style="display: grid; grid-template-columns: 220px 1fr; gap: 32px; padding: 28px 0; border-top: 1px solid #2A2A2E; align-items: baseline">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6; line-height: 1.7">HEADING<br>Archivo 700<br>32–44px</div>
        <div style="font-family: Archivo, sans-serif; font-stretch: 106%; font-weight: 700; font-size: 40px; line-height: 1.1">Sound, lighting and video for events that matter</div>
      </div>
      <div style="display: grid; grid-template-columns: 220px 1fr; gap: 32px; padding: 28px 0; border-top: 1px solid #2A2A2E; align-items: baseline">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6; line-height: 1.7">BODY<br>Inter 400<br>17px / 1.6</div>
        <div style="font-size: 17px; line-height: 1.6; color: #C9C9CC; max-width: 680px">We run the room from the first cue to the last track. Tell us the date, the venue and the vibe, and we will build the setup around it.</div>
      </div>
      <div style="display: grid; grid-template-columns: 220px 1fr; gap: 32px; padding: 28px 0; border-top: 1px solid #2A2A2E; border-bottom: 1px solid #2A2A2E; align-items: baseline">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6; line-height: 1.7">LABEL / SPEC<br>JetBrains Mono 500<br>12–13px · tracked</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #F4F4F0">DJ EQUIPMENT · CDJ · QTY 2 · [YOUR PRICE] / DAY</div>
      </div>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: 280px 1fr; gap: 48px">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #A1A1A6; letter-spacing: 0.08em">04 / BUTTONS</div>
    <div style="display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center">
        <button type="button" style="background: {{book}}; color: #0A0A0B; border: 0; height: 52px; padding: 0 28px; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer">Book Evo</button>
        <button type="button" style="background: {{rent}}; color: #0A0A0B; border: 0; height: 52px; padding: 0 28px; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer">Add to quote</button>
        <button type="button" style="background: transparent; color: #F4F4F0; border: 1px solid #F4F4F0; height: 52px; padding: 0 28px; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer">View setups</button>
        <a href="#" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-decoration: underline; text-underline-offset: 6px">SEE ALL RENTALS →</a>
      </div>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #C9C9CC; max-width: 760px">Square corners everywhere: the look of road cases and stage decks, not app bubbles. One filled button per screen section. Laser for booking, Cue for renting, outline for everything else.</p>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: 280px 1fr; gap: 48px">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #A1A1A6; letter-spacing: 0.08em">05 / COMPONENTS</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
      <div style="background: #141416; border: 1px solid #2A2A2E; display: flex; flex-direction: column">
        <div style="height: 220px; display: flex; align-items: center; justify-content: center; background: #141416; border-bottom: 1px solid #2A2A2E; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6; text-align: center; padding: 16px">TRANSPARENT PRODUCT PNG<br>on Stage background</div>
        <div style="padding: 20px; display: flex; flex-direction: column; gap: 8px">
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #A1A1A6">LIGHTING · MOVING HEAD</div>
          <div style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 20px">[Fixture name]</div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">[YOUR PRICE] / day</span>
            <button type="button" style="background: {{rent}}; color: #0A0A0B; border: 0; height: 44px; padding: 0 16px; font-family: Archivo, sans-serif; font-weight: 800; font-size: 13px; text-transform: uppercase; cursor: pointer">+ Quote</button>
          </div>
        </div>
      </div>
      <div style="position: relative; background: #1E1E22; min-height: 360px; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; box-sizing: border-box; gap: 8px">
        <div style="position: absolute; top: 20px; left: 24px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6">EVENT PHOTO, FULL BLEED</div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: {{book}}">EVENT TYPE</div>
        <div style="font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 32px; text-transform: uppercase; line-height: 1">Weddings</div>
        <div style="font-size: 14px; color: #C9C9CC">Ceremony audio, uplighting and a dance floor that stays full.</div>
      </div>
      <div style="background: #141416; border: 1px solid #2A2A2E; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">EVENT DATE<input type="text" placeholder="MM / DD / YYYY" style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"></label>
        <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">TYPE OF EVENT<select style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"><option>Wedding</option><option>Corporate</option><option>Concert / Live</option><option>Private party</option></select></label>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <span style="border: 1px solid #F4F4F0; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px">AUDIO</span>
          <span style="border: 1px solid #2A2A2E; color: #A1A1A6; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px">LIGHTING</span>
          <span style="border: 1px solid #2A2A2E; color: #A1A1A6; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px">VIDEO</span>
        </div>
      </div>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: 280px 1fr; gap: 48px">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #A1A1A6; letter-spacing: 0.08em">06 / VOICE</div>
      <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #A1A1A6">Same crew, two conversations. Short sentences, real gear names, no hype words.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <div style="border-top: 4px solid {{book}}; background: #141416; padding: 28px; display: flex; flex-direction: column; gap: 14px">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">TALKING TO: CLIENTS BOOKING EVO</div>
        <div style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.2">"You bring the guests. We bring the night."</div>
        <ul style="margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.7; color: #C9C9CC">
          <li>Lead with the experience and the moment</li>
          <li>Show real rooms and real crowds</li>
          <li>Ask about the date, venue and vibe</li>
        </ul>
      </div>
      <div style="border-top: 4px solid {{rent}}; background: #141416; padding: 28px; display: flex; flex-direction: column; gap: 14px">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">TALKING TO: PROS RENTING GEAR</div>
        <div style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 26px; line-height: 1.2">"Show-ready gear. Tested, cased, on time."</div>
        <ul style="margin: 0; padding-left: 18px; font-size: 15px; line-height: 1.7; color: #C9C9CC">
          <li>Lead with specs, quantities and price</li>
          <li>Make it fast: browse, add to quote, send</li>
          <li>Offer delivery, setup and tech add-ons</li>
        </ul>
      </div>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: 280px 1fr; gap: 48px">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #A1A1A6; letter-spacing: 0.08em">07 / IMAGERY</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; font-size: 15px; line-height: 1.55; color: #C9C9CC">
      <div style="display: flex; flex-direction: column; gap: 8px"><div style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 18px; color: #F4F4F0">Real events only</div><p style="margin: 0">Pull from the Drive folders, the Patrisso shoot and @evolivepro. If a shot is soft, dark or messy, it does not go on the site.</p></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><div style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 18px; color: #F4F4F0">Gear on transparent</div><p style="margin: 0">Every rental item shot or cut out on a transparent background, same angle and scale, so the catalog reads clean on black.</p></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><div style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 18px; color: #F4F4F0">No AI look</div><p style="margin: 0">No glowing gradients, fake renders, stock DJs or neon blur. Light comes from the photos, not from effects added on top.</p></div>
    </div>
  </section>

  <section style="display: grid; grid-template-columns: 280px 1fr; gap: 48px">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #A1A1A6; letter-spacing: 0.08em">08 / BACKEND</div>
    <div style="background: #141416; border: 1px solid #2A2A2E; padding: 28px; display: flex; gap: 32px; align-items: center; flex-wrap: wrap">
      <div style="font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 28px; text-transform: uppercase">Stagera</div>
      <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #C9C9CC; flex: 1 1 420px">Booking inquiries, contact forms and rental quote requests all hand off to Stagera. Anything marked with the STAGERA tag in the wireframes is a hand-off point. Exact fields and inventory sync to be confirmed against Tim's Stagera setup.</p>
      <span style="border: 1px solid #F4F4F0; padding: 8px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">→ STAGERA</span>
    </div>
  </section>

</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"book":{"editor":"color","default":"#E6307F","options":["#E6307F","#3DF5FF","#FFE03C"]},"rent":{"editor":"color","default":"#00D4F0","options":["#00D4F0","#FF3D7F","#4D8CFF"]},"$preview":{"width":1440,"height":3000}}'>
class Component extends DCLogic {
  renderVals() {
    const book = this.props.book ?? '#E6307F';
    const rent = this.props.rent ?? '#00D4F0';
    return { book, rent, bookHex: book.toUpperCase(), rentHex: rent.toUpperCase() };
  }
}
</script>

<script src="dc-runtime.js"></script>

font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;
padding:10px 12px;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.pv-back:hover{background:#E6307F;color:#0A0A0B}

</body>

      <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #C9C9CC">[Origin story from Tim and Dom: how Evo started, the first gig, and how it grew from DJ sets into full production. 2–3 short paragraphs.]</p>

    <div style="display: flex; flex-direction: column">

<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":1440,"height":2700}}'>
class Component extends DCLogic {
  renderVals() {
    const d = "[Dom's answer]";
    return {
      qa: [
        { q: 'When you’re not running events, you can find us…', tim: 'Spending unnecessary money on cars, collectibles and gear.', dom: d },
        { q: 'The piece of gear you’ll never leave the warehouse without', tim: 'Gaff tape.', dom: d },
        { q: 'Worst production trend?', tim: 'Tube lights. Can be cool, but overdone.', dom: d },
        { q: 'Favorite production element to flex on a stage', tim: 'BRING OUT THE LASERS.', dom: d },
        { q: 'Top genres you listen to', tim: 'EDM, Hip Hop, Alternative Rock, R&B', dom: d },
        { q: 'Go-to track to test on a rig', tim: 'Honestly, any Knock2.', dom: d }
      ]
    };
  }
}
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Evo Live Pro About · Preview</title>
<link rel="icon" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0B}
a{color:#F4F4F0}a:hover{color:#E6307F}
</style>
<style>
body{margin:0;background:#0A0A0B}
.evh-links{display:flex}
.evh-ctas{display:flex}
.evh-menu{display:none}
.evh-mbar{display:none}
.evh-menu summary{list-style:none}
.evh-menu summary::-webkit-details-marker{display:none}
@media (max-width: 900px){
  .evh-links,.evh-ctas{display:none !important}
  .evh-menu{display:block}
  .evh-mbar{display:grid}
  .ev-page{padding-bottom:64px}
}
</style>
<link rel="stylesheet" href="motion.css">
<script>(function(){var r=document.documentElement;try{if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||window.self!==window.top)return;var h=sessionStorage.getItem('evo-handoff');if(h){r.classList.add('evo-handoff');r.style.setProperty('--evo-cover',JSON.parse(h).color);}else if(false&&(location.search.indexOf('intro')>-1||!sessionStorage.getItem('evo-intro-seen'))){r.classList.add('evo-intro');}}catch(e){}setTimeout(function(){r.classList.remove('evo-intro','evo-handoff')},4000);})();</script>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div class="ev-page" style="background: #0A0A0B; color: #F4F4F0; font-family: Inter, system-ui, sans-serif; min-height: 100vh">

  <dc-import name="Header" active="about" hint-size="100%,69px"></dc-import>

  <section style="max-width: 1320px; margin: 0 auto; padding: 56px 16px; display: flex; flex-wrap: wrap; gap: 40px; align-items: center">
    <div style="flex: 1 1 400px; display: flex; flex-direction: column; gap: 16px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">ABOUT US · OUR ORIGINS</span>
      <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 118%; font-weight: 800; font-size: clamp(28px, 4.2vw, 60px); line-height: 1; text-transform: uppercase">Two founders, one warehouse, a lot of gaff tape</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #C9C9CC">[Origin story from Tim and Dom: how Evo started in Lyndhurst, NJ, the first gig, and how it grew from DJ sets into full production. 2–3 short paragraphs.]</p>
    </div>
    <div style="flex: 1 1 400px; background: #1E1E22; min-height: 420px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6; text-align: center; padding: 24px">PHOTO · TIM + DOM TOGETHER<br>Brandon Patrisso shoot</div>
  </section>

  <section style="background: #141416; border-top: 1px solid #2A2A2E; border-bottom: 1px solid #2A2A2E">
    <div style="max-width: 1320px; margin: 0 auto; padding: 72px 16px; display: flex; flex-direction: column; gap: 32px">
      <h2 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: clamp(28px, 3.2vw, 40px); line-height: 1; text-transform: uppercase">Meet the crew</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="background: #1E1E22; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6">PORTRAIT · TIMOTHY</div>
          <span style="font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 26px; text-transform: uppercase">Timothy</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #E6307F">CO-FOUNDER &amp; CREATIVE DIRECTOR</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="background: #1E1E22; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6">PORTRAIT · DOMINICK</div>
          <span style="font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 26px; text-transform: uppercase">Dominick</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #E6307F">CO-FOUNDER &amp; TECHNICAL OPERATIONS</span>
        </div>
      </div>
    </div>
  </section>

  <section style="max-width: 1320px; margin: 0 auto; padding: 72px 16px; display: flex; flex-direction: column; gap: 28px">
    <h2 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: clamp(28px, 3.2vw, 40px); line-height: 1; text-transform: uppercase">Off the record</h2>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{qa}}" as="r" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; padding: 22px 0; border-top: 1px solid #2A2A2E">
          <span style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 19px; line-height: 1.3">{{r.q}}</span>
          <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #A1A1A6">TIM</span><span style="font-size: 16px; line-height: 1.5">{{r.tim}}</span></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #A1A1A6">DOM</span><span style="font-size: 16px; line-height: 1.5; color: #A1A1A6">{{r.dom}}</span></div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="border-top: 1px solid #2A2A2E">
    <div style="max-width: 1320px; margin: 0 auto; padding: 64px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">WHAT EVO BRINGS THAT OTHERS DON'T, IN THREE WORDS</span>
      <span style="font-family: Archivo, sans-serif; font-stretch: 118%; font-weight: 800; font-size: clamp(28px, 4vw, 56px); text-transform: uppercase; line-height: 1">[Word] · [Word] · [Word]</span>
    </div>
  </section>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":1440,"height":2600}}'>
class Component extends DCLogic {
  renderVals() {
    const d = "[Dom's answer]";
    return {
      qa: [
        { q: 'When you’re not running events, you can find us…', tim: 'Spending unnecessary money on cars, collectibles and gear.', dom: d },
        { q: 'The piece of gear you’ll never leave the warehouse without', tim: 'Gaff tape.', dom: d },
        { q: 'Worst production trend?', tim: 'Tube lights. Can be cool, but overdone.', dom: d },
        { q: 'Favorite production element to flex on a stage', tim: 'BRING OUT THE LASERS.', dom: d },
        { q: 'Top genres you listen to', tim: 'EDM, Hip Hop, Alternative Rock, R&B', dom: d },
        { q: 'Go-to track to test on a rig', tim: 'Honestly, any Knock2.', dom: d }
      ]
    };
  }
}
</script>
<template id="dc-template-Header">

<header style="background: #0A0A0B; border-bottom: 1px solid #2A2A2E; font-family: Inter, system-ui, sans-serif; color: #F4F4F0; position: relative; z-index: 20">
  <nav aria-label="Main" style="max-width: 1320px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 24px; justify-content: space-between">
    <a href="home.html" style="display: block; flex: none"><img src="assets/logo-wordmark.png" alt="Evo Live Pro home" style="width: 156px; height: auto; display: block"></a>
    <div class="evh-links" style="gap: 20px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; justify-content: center; flex: 1 1 auto">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="7">
        <a href="{{l.href}}" style="{{l.style}}">{{l.label}}</a>
      </sc-for>
    </div>
    <div class="evh-ctas" style="gap: 8px; flex: none">
      <a href="contact.html" style="background: #E6307F; color: #0A0A0B; text-decoration: none; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 13px; letter-spacing: 0.04em">BOOK EVO</a>
      <a href="rentals.html" style="background: #00D4F0; color: #0A0A0B; text-decoration: none; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 13px; letter-spacing: 0.04em">{{rentLabel}}</a>
    </div>
    <details class="evh-menu" style="position: static">
      <summary aria-label="Open menu" style="width: 44px; height: 44px; border: 1px solid #2A2A2E; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #F4F4F0">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"></path></svg>
      </summary>
      <div style="position: absolute; left: 0; right: 0; top: 100%; background: #0A0A0B; border-bottom: 1px solid #2A2A2E; padding: 8px 16px 20px; display: flex; flex-direction: column">
        <sc-for list="{{links}}" as="l" hint-placeholder-count="7">
          <a href="{{l.href}}" style="{{l.mStyle}}">{{l.label}}</a>
        </sc-for>
      </div>
    </details>
  </nav>
</header>
<nav class="evh-mbar" aria-label="Quick actions" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #2A2A2E">
  <a href="contact.html" style="background: #E6307F; color: #0A0A0B; text-decoration: none; height: 60px; display: flex; align-items: center; justify-content: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 15px; letter-spacing: 0.04em">BOOK EVO</a>
  <a href="rentals.html" style="background: #00D4F0; color: #0A0A0B; text-decoration: none; height: 60px; display: flex; align-items: center; justify-content: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 15px; letter-spacing: 0.04em">{{rentLabel}}</a>
</nav>
</template>
<script type="text/x-dc" id="dc-logic-Header" data-props='{"active":{"editor":"enum","options":["home","about","rentals","events","partners","photos","contact"],"default":"home"},"quote":{"editor":null,"default":""},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const items = [
      ['home', 'HOME', 'Home.dc.html'],
      ['about', 'ABOUT US', 'About.dc.html'],
      ['rentals', 'RENTALS', 'Rentals.dc.html'],
      ['events', 'EVENTS', 'Events.dc.html'],
      ['partners', 'PARTNERS', 'Home.dc.html#partners'],
      ['photos', 'PHOTOS', 'Photos.dc.html'],
      ['contact', 'CONTACT US', 'Contact.dc.html']
    ];
    const links = items.map(([id, label, href]) => ({
      label, href,
      style: 'text-decoration: none; color: ' + (id === active ? '#F4F4F0' : '#A1A1A6'),
      mStyle: 'text-decoration: none; padding: 14px 0; border-bottom: 1px solid #2A2A2E; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 22px; color: ' + (id === active ? '#E6307F' : '#F4F4F0')
    }));
    const q = this.props.quote;
    return { links, rentLabel: q !== undefined && q !== '' ? 'QUOTE (' + q + ')' : 'RENT GEAR' };
  }
}
</script>

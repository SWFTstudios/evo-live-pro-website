  renderVals() {
    const book = this.state.mode === 'book';
    const tab = (on, color) => 'height: 44px; padding: 0 18px; border: 0; cursor: pointer; font-family: Archivo, sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.04em; ' + (on ? 'background: ' + color + '; color: #0A0A0B' : 'background: transparent; color: #A1A1A6');
    const accent = book ? '#B8FF3C' : '#FF6A1F';
    return {
      pickBook: () => this.setState({ mode: 'book' }),
      pickRent: () => this.setState({ mode: 'rent' }),
      bookTab: tab(book, '#B8FF3C'),
      rentTab: tab(!book, '#FF6A1F'),
      submitLabel: book ? 'Request a booking' : 'Request a rental quote',
      submitStyle: 'align-self: flex-start; height: 52px; padding: 0 28px; border: 0; cursor: pointer; background: ' + accent + '; color: #0A0A0B; font-family: Archivo, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase'
    };
  }
}

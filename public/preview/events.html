<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":1440,"height":4200}}'>
class Component extends DCLogic {
  renderVals() {
    const card = 'text-decoration: none; color: #F4F4F0; position: relative; background: #1E1E22; min-height: 340px; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; gap: 8px; box-sizing: border-box';
    const svc = [
      ['Weddings', 'PHOTO · GRAZIANO / LAM / SULLIVAN', 'Ceremony, cocktail hour and a reception that stays packed. Packages from $5,500.', 'SEE PACKAGES →', '#packages', false],

      ['Concerts &amp; Live Events', 'PHOTO · LASERS, CROWD', 'Line arrays, lasers, CO2 and LED walls for headliners and festival stages.', 'PRODUCE A SHOW →', 'Contact.dc.html', false],
      ['Private Parties', 'PHOTO · PRIVATE PARTY', 'Birthdays, milestones and house parties with a club-level setup.', 'BOOK A PARTY →', 'Contact.dc.html', false],
      ['Rentals', 'PHOTO · CASED GEAR', 'Just need the gear? Rent our sound, lighting, video, staging, DJ and FX equipment.', 'BROWSE RENTALS →', 'Rentals.dc.html', true]
    ];
    const services = svc.map(([title, photo, copy, cta, href, rent]) => ({
      title: title.replace('&amp;', '&'), photo, copy, cta, href,
      box: card + (rent ? '; border-top: 4px solid #00D4F0' : ''),
      ctaStyle: "font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: " + (rent ? '#00D4F0' : '#E6307F')
    }));
    const tierBox = 'background: #0A0A0B; border: 1px solid #2A2A2E; padding: 22px; display: flex; flex-direction: column; gap: 10px';
    const tiers = [
      ['UP TO 150 GUESTS', 'The Architectural Essentials', '$5,500', ['Custom DJ furniture', '(2) intelligent lights', '(12) wireless uplights', 'High-end sound system', 'Lead DJ/MC, secondary DJ, production tech']],
      ['UP TO 250 GUESTS', 'The Elevated Design Experience', '$8,500', ['Custom DJ furniture', '(4) intelligent lights, (18) uplights', 'Digital photo booth + attendant', 'FX: (2) cold sparks or Dancing on the Clouds', 'Lead DJ/MC, secondary DJ']],
      ['UP TO 350 GUESTS', 'The Nightlife Reserve', '$12,500', ['DJ furniture with media screen', '(6) intelligent lights, (24) uplights', 'FX suite: CO2 cannons, CO2 jets, (4) cold sparks', 'Concert-level sound', 'Lighting director, content creator, production techs']],
      ['NO LIMIT', 'The Bespoke Production Reserve', '$22,500+', ['Custom modular LED video wall', 'Tailored stage build, (8) intelligent lights', 'Full FX: lasers, CO2, cold sparks, low fog', 'RCF line array system', 'Master LD, VJ, audio tech, content creator, photo booth']]
    ].map(([guests, name, price, lines]) => ({ guests, name, price, lines, box: tierBox + (price === '$22,500+' ? '; border-color: #E6307F' : '') }));
    const carte = [
      ['Ceremony', '$800'], ['Cocktail hour', '$700'], ['Ceremony + cocktail bundle', '$1,300'], ['After party DJ', '$1,000+'],
      ['(2) Retro hexagons', '$300'], ['(2) Lasers + operator', '$1,400'], ['(2) CO2 jets', '$500'], ['Handheld CO2 cannon', '$350'],
      ['Dancing on the Clouds', '$400'], ['(2) Cold sparks + permit', '$600'], ['Media screens', '$250'], ['Content creator', '$850+'],
      ["Video wall 8'×4'", '$1,200'], ["Video wall 14'×7'", '$3,400'], ["Video wall 16.5'×9.5'", '$5,500'], ['Travel', 'TBD'],
      ["Stage 4'×8'", '$175'], ["Stage 8'×8'", '$350'], ["Stage 12'×8'", '$500'], ["Stage 16'×8'", '$650']
    ].map(([name, price]) => ({ name, price }));
    return { services, tiers, carte };
  }
}
</script>

<script type="text/x-dc" id="dc-logic-Header" data-props='{"active":{"editor":"enum","options":["home","about","rentals","events","partners","photos","contact"],"default":"home"},"quote":{"editor":null,"default":""},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const items = [
      ['home', 'HOME', 'Home.dc.html'],
      ['about', 'ABOUT US', 'About.dc.html'],
      ['rentals', 'RENTALS', 'Rentals.dc.html'],
      ['events', 'EVENTS', 'Events.dc.html'],
      ['partners', 'PARTNERS', 'Home.dc.html#partners'],
      ['photos', 'PHOTOS', 'Photos.dc.html'],
      ['contact', 'CONTACT US', 'Contact.dc.html']
    ];
    const links = items.map(([id, label, href]) => ({
      label, href,
      style: 'text-decoration: none; color: ' + (id === active ? '#F4F4F0' : '#A1A1A6'),
      mStyle: 'text-decoration: none; padding: 14px 0; border-bottom: 1px solid #2A2A2E; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 22px; color: ' + (id === active ? '#E6307F' : '#F4F4F0')
    }));
    const q = this.props.quote;
    return { links, rentLabel: q !== undefined && q !== '' ? 'QUOTE (' + q + ')' : 'RENT GEAR' };
  }
}
</script>

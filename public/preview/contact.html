<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Evo Live Pro Contact · Preview</title>
<link rel="icon" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0B}
a{color:#F4F4F0}a:hover{color:#E6307F}
</style>
<style>
body{margin:0;background:#0A0A0B}
.evh-links{display:flex}
.evh-ctas{display:flex}
.evh-menu{display:none}
.evh-mbar{display:none}
.evh-menu summary{list-style:none}
.evh-menu summary::-webkit-details-marker{display:none}
@media (max-width: 900px){
  .evh-links,.evh-ctas{display:none !important}
  .evh-menu{display:block}
  .evh-mbar{display:grid}
  .ev-page{padding-bottom:64px}
}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">

<div class="ev-page" style="background: #0A0A0B; color: #F4F4F0; font-family: Inter, system-ui, sans-serif; min-height: 100vh">

  <dc-import name="Header" active="contact" hint-size="100%,69px"></dc-import>

  <div style="max-width: 1320px; margin: 0 auto; padding: 56px 16px 88px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">CONTACT US</span>
        <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 118%; font-weight: 800; font-size: clamp(28px, 4.2vw, 60px); line-height: 1; text-transform: uppercase">Ready to elevate your next event?</h1>
        <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #C9C9CC; max-width: 640px">Whether you are a venue manager looking for a full production install or a fellow professional seeking a rental, we are ready to assist.</p>
      </div>
      <div role="group" aria-label="Choose a path" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
        <button type="button" onClick="{{pickBook}}" style="{{bookCard}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">HIRE THE CREW</span><span style="font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 24px; text-transform: uppercase">Book Evo</span><span style="font-size: 14px; line-height: 1.45">DJ, production or a full event</span></button>
        <button type="button" onClick="{{pickRent}}" style="{{rentCard}}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em">GEAR ONLY</span><span style="font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 24px; text-transform: uppercase">Rent equipment</span><span style="font-size: 14px; line-height: 1.45">Pickup or delivery, setup optional</span></button>
      </div>

      <form style="display: flex; flex-direction: column; gap: 14px; background: #141416; border: 1px solid #2A2A2E; padding: 24px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px">
          <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">{{dateLabel}}<input type="text" placeholder="MM / DD / YYYY" style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"></label>
          <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">VENUE<input type="text" placeholder="Venue name or address" style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"></label>
          <sc-if value="{{isBook}}" hint-placeholder-val="{{ true }}">
            <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">TYPE OF EVENT<select style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"><option>Wedding</option><option>Corporate</option><option>Concert / live</option><option>Private party</option><option>Other</option></select></label>
            <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">GUEST COUNT<input type="text" placeholder="Approx." style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"></label>
            <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">BUDGET RANGE<select style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"><option>Under $2,500</option><option>$2,500 – $5,500</option><option>$5,500 – $8,500</option><option>$8,500 – $12,500</option><option>$12,500+</option><option>Not sure yet</option></select></label>
          </sc-if>
          <sc-if value="{{isRent}}" hint-placeholder-val="{{ false }}">
            <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">RETURN DATE<input type="text" placeholder="MM / DD / YYYY" style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"></label>
            <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">PICKUP OR DELIVERY<select style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"><option>Delivery + setup</option><option>Delivery only</option><option>Warehouse pickup (Lyndhurst, NJ)</option></select></label>
          </sc-if>
          <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">NAME<input type="text" style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"></label>
          <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">EMAIL<input type="email" style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"></label>
          <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">PHONE<input type="tel" style="height: 48px; background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 0 14px; font-family: Inter, sans-serif; font-size: 16px"></label>
        </div>
        <label style="display: flex; flex-direction: column; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">{{notesLabel}}<textarea rows="4" style="background: #1E1E22; border: 1px solid #2A2A2E; color: #F4F4F0; padding: 12px 14px; font-family: Inter, sans-serif; font-size: 16px; resize: vertical"></textarea></label>
        <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap">
          <button type="submit" style="{{submitStyle}}">{{submitLabel}}</button>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #A1A1A6">→ CREATES A {{stageraRecord}} IN STAGERA</span>
        </div>
      </form>
    </main>

    <aside style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 22px; padding-top: 8px">
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">CALL OR TEXT</span><a href="tel:+12019139558" style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 22px; text-decoration: none">(201) 913-9558</a></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">EMAIL</span><a href="mailto:evolivepro@gmail.com" style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 22px; text-decoration: none">evolivepro@gmail.com</a></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">BASED IN</span><span style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 22px">Lyndhurst, NJ 07071</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #A1A1A6">INSTAGRAM</span><a href="https://instagram.com/evolivepro" style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 22px; text-decoration: none">@evolivepro</a></div>
      <div style="background: #1E1E22; min-height: 200px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A1A1A6">PHOTO · CREW AT LOAD-IN</div>
    </aside>
  </div>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'book' }; }
  renderVals() {
    const book = this.state.mode === 'book';
    const card = (on, color) => 'display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 20px; cursor: pointer; min-height: 124px; font-family: Inter, sans-serif; ' + (on ? 'background: ' + color + '; color: #0A0A0B; border: 1px solid ' + color : 'background: #141416; color: #F4F4F0; border: 1px solid #2A2A2E');
    const accent = book ? '#E6307F' : '#00D4F0';
    return {
      pickBook: () => this.setState({ mode: 'book' }),
      pickRent: () => this.setState({ mode: 'rent' }),
      bookCard: card(book, '#E6307F'),
      rentCard: card(!book, '#00D4F0'),
      isBook: book,
      isRent: !book,
      dateLabel: book ? 'EVENT DATE' : 'PICKUP DATE',
      notesLabel: book ? 'TELL US THE VIBE (OR WHICH PACKAGE)' : 'WHAT GEAR DO YOU NEED?',
      submitLabel: book ? 'Request a booking' : 'Request a rental quote',
      stageraRecord: book ? 'BOOKING INQUIRY' : 'RENTAL QUOTE',
      submitStyle: 'height: 52px; padding: 0 24px; border: 0; cursor: pointer; background: ' + accent + '; color: #0A0A0B; font-family: Archivo, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase'
    };
  }
}
</script>
<template id="dc-template-Header">

<header style="background: #0A0A0B; border-bottom: 1px solid #2A2A2E; font-family: Inter, system-ui, sans-serif; color: #F4F4F0; position: relative; z-index: 20">
  <nav aria-label="Main" style="max-width: 1320px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 24px; justify-content: space-between">
    <a href="home.html" style="display: block; flex: none"><img src="assets/logo-wordmark.png" alt="Evo Live Pro home" style="width: 156px; height: auto; display: block"></a>
    <div class="evh-links" style="gap: 20px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; justify-content: center; flex: 1 1 auto">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="7">
        <a href="{{l.href}}" style="{{l.style}}">{{l.label}}</a>
      </sc-for>
    </div>
    <div class="evh-ctas" style="gap: 8px; flex: none">
      <a href="contact.html" style="background: #E6307F; color: #0A0A0B; text-decoration: none; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 13px; letter-spacing: 0.04em">BOOK EVO</a>
      <a href="rentals.html" style="background: #00D4F0; color: #0A0A0B; text-decoration: none; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 13px; letter-spacing: 0.04em">{{rentLabel}}</a>
    </div>
    <details class="evh-menu" style="position: static">
      <summary aria-label="Open menu" style="width: 44px; height: 44px; border: 1px solid #2A2A2E; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #F4F4F0">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"></path></svg>
      </summary>
      <div style="position: absolute; left: 0; right: 0; top: 100%; background: #0A0A0B; border-bottom: 1px solid #2A2A2E; padding: 8px 16px 20px; display: flex; flex-direction: column">
        <sc-for list="{{links}}" as="l" hint-placeholder-count="7">
          <a href="{{l.href}}" style="{{l.mStyle}}">{{l.label}}</a>
        </sc-for>
      </div>
    </details>
  </nav>
</header>
<nav class="evh-mbar" aria-label="Quick actions" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #2A2A2E">
  <a href="contact.html" style="background: #E6307F; color: #0A0A0B; text-decoration: none; height: 60px; display: flex; align-items: center; justify-content: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 15px; letter-spacing: 0.04em">BOOK EVO</a>
  <a href="rentals.html" style="background: #00D4F0; color: #0A0A0B; text-decoration: none; height: 60px; display: flex; align-items: center; justify-content: center; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 15px; letter-spacing: 0.04em">{{rentLabel}}</a>
</nav>
</template>
<script type="text/x-dc" id="dc-logic-Header" data-props='{"active":{"editor":"enum","options":["home","about","rentals","events","partners","photos","contact"],"default":"home"},"quote":{"editor":null,"default":""},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const items = [
      ['home', 'HOME', 'Home.dc.html'],
      ['about', 'ABOUT US', 'About.dc.html'],
      ['rentals', 'RENTALS', 'Rentals.dc.html'],
      ['events', 'EVENTS', 'Events.dc.html'],
      ['partners', 'PARTNERS', 'Home.dc.html#partners'],
      ['photos', 'PHOTOS', 'Photos.dc.html'],
      ['contact', 'CONTACT US', 'Contact.dc.html']
    ];
    const links = items.map(([id, label, href]) => ({
      label, href,
      style: 'text-decoration: none; color: ' + (id === active ? '#F4F4F0' : '#A1A1A6'),
      mStyle: 'text-decoration: none; padding: 14px 0; border-bottom: 1px solid #2A2A2E; font-family: Archivo, sans-serif; font-stretch: 112%; font-weight: 800; font-size: 22px; color: ' + (id === active ? '#E6307F' : '#F4F4F0')
    }));
    const q = this.props.quote;
    return { links, rentLabel: q !== undefined && q !== '' ? 'QUOTE (' + q + ')' : 'RENT GEAR' };
  }
}
</script>
<script src="dc-runtime.js"></script>
<a class="pv-back" href="./">&larr; All pages</a>
<style>
.pv-back{position:fixed;left:12px;bottom:12px;z-index:50;background:#F4F4F0;color:#0A0A0B;
font:500 11px/1 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;
padding:10px 12px;text-decoration:none;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.pv-back:hover{background:#E6307F;color:#0A0A0B}
@media (max-width:900px){.pv-back{bottom:70px;left:auto;right:8px;padding:8px 10px;font-size:10px;opacity:.9}}
.pv-embed .pv-back{display:none}
</style>
<script>if (window.self !== window.top) document.documentElement.classList.add('pv-embed');</script>
</body>
</html>

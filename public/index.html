<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evo Live Pro</title>
  <meta name="description" content="Evo Live Pro: audio-visual and live event production.">
  <style>
    :root { color-scheme: light dark; --bg: #0b0b0f; --fg: #f4f4f6; --muted: #9a9aa6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; letter-spacing: -.02em; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Evo Live Pro</h1>
    <p>Audio-visual and live event production. New site coming soon.</p>
  </main>
</body>
</html>
